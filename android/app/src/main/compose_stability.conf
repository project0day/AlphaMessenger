// ─────────────────────────────────────────────────────────────────────────────
// Compose compiler stability overrides  (BLOCK I)
// Wired in via  -P plugin:androidx.compose.compiler.plugins.kotlin:stabilityConfigurationPath
// (see compose_compiler_config.gradle.kts). Each line = a fully-qualified pattern.
// ─────────────────────────────────────────────────────────────────────────────

// UniFFI-generated FFI models. Generated with `var` fields → inferred UNSTABLE,
// which poisons skippability of every bubble/row that reads a ChatInfo/MessageInfo.
// They are regenerated on every build, so @Stable cannot be added to the source;
// marking the whole package stable here is the correct, durable fix.
uniffi.alphamessenger.*

// Project domain models that are built once and never mutated after construction
// (defensive — keeps them stable even if a future field uses a Mutable* type).
com.alphamessenger.ui.chat.MessageUi
com.alphamessenger.ui.chat.ReplyInfo
com.alphamessenger.ui.chat.AlbumItemMetadata
com.alphamessenger.transfer.TransferSnapshot
com.alphamessenger.transfer.TransferProgress
com.alphamessenger.transfer.TransferKey
