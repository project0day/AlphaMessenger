name = "rs-blossom-b2"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Secrets (set with `wrangler secret put`, never here): B2_KEY_ID, B2_APP_KEY, UPLOAD_TOKEN
[vars]
B2_BUCKET = "github-ai"
B2_REGION = "eu-central-003"
B2_ENDPOINT = "https://s3.eu-central-003.backblazeb2.com"

# Errors only: no per-request records (they would hold readers' addresses).
[observability.logs]
enabled = true
invocation_logs = false
