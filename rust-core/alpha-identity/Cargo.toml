[package]
name = "alpha-identity"
version = "0.1.0"
edition = "2021"

[dependencies]
openmls = { workspace = true }
openmls-basic-credential = { workspace = true, features = ["clonable"] }
openmls-rust-crypto = { workspace = true }
openmls-traits = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
tls_codec = { workspace = true }
nostr = { workspace = true }
zeroize = { workspace = true }
argon2 = { workspace = true }

# AES-256-GCM for key vault encryption
aes-gcm = "0.10"
# SHA-256 (still used for misc hashing)
sha2 = "0.10"
