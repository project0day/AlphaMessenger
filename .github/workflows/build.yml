name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 28.2.13676358

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # attach the APK to a release on a version tag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Core library (Rust → arm64) and bindings check
        run: ./build_so.sh

      - uses: gradle/actions/setup-gradle@v4

      # A version tag publishes a release signed with the release key, if the key is
      # in this repository's secrets. Without them the release APK is attached by hand.
      - name: Release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No release key in the secrets: this tag builds an unsigned check APK only."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: APK
        working-directory: android
        run: |
          if [ -f keystore.properties ]; then ./gradlew :app:assembleRelease --no-daemon
          else ./gradlew :app:assembleRelease -PallowUnsigned --no-daemon; fi

      - name: Checksums
        run: |
          cd android/app/build/outputs/apk/release
          sha256sum *.apk | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: alpha-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Forget the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/keystore.properties
